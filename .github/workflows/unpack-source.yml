name: Unpack sanitized source

on:
  push:
    branches: [ main ]
    paths:
      - 'source_bundle.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand sanitized source
        shell: bash
        run: |
          if [ ! -f source_bundle.zip ]; then
            echo 'Bundle already removed; nothing to do.'
            exit 0
          fi
          unzip -oq source_bundle.zip -d .
          rm -f source_bundle.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add sanitized MyRecord v1.8.1 source'
          git push
